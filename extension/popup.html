<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Job Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 360px;
      background: #0f0f12;
      color: #e8e8ec;
      padding: 16px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header-icon { font-size: 20px; }
    .header h1 { font-size: 15px; font-weight: 600; color: #fff; }
    .header p  { font-size: 11px; color: #777; }

    /* ── Job preview card ── */
    .job-card {
      background: #1a1a20;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .job-card .title {
      font-size: 13px; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card .company {
      font-size: 12px; color: #888; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card .url {
      font-size: 10px; color: #555; margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card.empty .title { color: #555; font-weight: 400; }

    /* ── Status badge ── */
    .status-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; min-height: 22px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 500;
      padding: 3px 8px; border-radius: 12px;
    }
    .badge.idle      { background: #1e1e26; color: #666; }
    .badge.scraping  { background: #1a2535; color: #4a9eff; }
    .badge.processing{ background: #1a2535; color: #f4a623; }
    .badge.success   { background: #102518; color: #4caf50; }
    .badge.error     { background: #281010; color: #ef5350; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .dot.pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Result box ── */
    .result-box {
      background: #1a1a20;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 11px;
      line-height: 1.6;
      display: none;
    }
    .result-box.visible { display: block; }

    .result-row {
      display: flex; justify-content: space-between;
      align-items: baseline; margin-bottom: 5px;
    }
    .result-row:last-child { margin-bottom: 0; }
    .result-row .label { color: #666; flex-shrink: 0; }
    .result-row .value {
      color: #ccc; font-weight: 500; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;
    }
    .value.link { color: #4a9eff; cursor: pointer; text-decoration: underline; }
    .value.link:hover { color: #7ab8ff; }

    .score-high { color: #4caf50 !important; }
    .score-low  { color: #ef5350 !important; }
    .score-mid  { color: #f4a623 !important; }

    /* divider inside result box */
    .result-divider {
      border: none; border-top: 1px solid #2a2a35;
      margin: 7px 0;
    }

    /* skill pills */
    .skills-row {
      display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 2px;
    }
    .skill-label {
      font-size: 10px; color: #555; margin-bottom: 3px;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .pill {
      font-size: 9px; padding: 2px 6px; border-radius: 10px; font-weight: 500;
    }
    .pill.match   { background: #0d2b1a; color: #4caf50; border: 1px solid #1a4a2a; }
    .pill.missing { background: #2b0d0d; color: #ef5350; border: 1px solid #4a1a1a; }

    /* all-scores sub-section */
    .scores-label {
      font-size: 10px; color: #555; margin-bottom: 4px;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .score-bar-row {
      display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
    }
    .score-bar-row .sname {
      color: #888; font-size: 10px; width: 110px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;
    }
    .score-bar-row .sname.best { color: #ccc; font-weight: 600; }
    .bar-track {
      flex: 1; height: 4px; background: #2a2a35; border-radius: 2px; overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 2px; background: #4a9eff; transition: width .3s; }
    .bar-fill.best { background: #4caf50; }
    .bar-fill.low  { background: #ef5350; }
    .score-bar-row .spct {
      font-size: 10px; color: #666; width: 34px; text-align: right; flex-shrink: 0;
    }

    /* ── Buttons ── */
    .btn {
      width: 100%; padding: 9px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: #4a9eff; color: #fff; }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-secondary {
      background: #1e1e26; color: #aaa;
      border: 1px solid #2a2a35; margin-top: 6px;
    }
    .btn-secondary:hover:not(:disabled) { color: #ddd; }

    /* ── Footer links ── */
    .footer-links {
      display: flex; justify-content: space-between;
      margin-top: 10px;
    }
    .footer-link {
      font-size: 10px; color: #444; text-decoration: none; cursor: pointer;
    }
    .footer-link:hover { color: #666; }

    /* ── Settings row ── */
    .settings-row {
      display: flex; align-items: center; gap: 6px; margin-top: 10px;
    }
    .settings-row label { font-size: 10px; color: #555; white-space: nowrap; }
    .settings-row input {
      flex: 1; background: #1a1a20; border: 1px solid #2a2a35;
      border-radius: 4px; color: #888; font-size: 10px; padding: 4px 6px; outline: none;
    }
    .settings-row input:focus { border-color: #4a9eff; color: #ccc; }
    .btn-save {
      background: #1e1e26; border: 1px solid #2a2a35; color: #888;
      font-size: 10px; padding: 4px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap;
    }
    .btn-save:hover { color: #ddd; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🤖</span>
    <div>
      <h1>AI Job Agent</h1>
      <p>Capture · Match · Outreach</p>
    </div>
  </div>

  <!-- Job preview -->
  <div class="job-card empty" id="jobCard">
    <div class="title" id="jobTitle">Scanning page…</div>
    <div class="company" id="jobCompany"></div>
    <div class="url" id="jobUrl"></div>
  </div>

  <!-- Status -->
  <div class="status-row">
    <span class="badge idle" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">Ready</span>
    </span>
  </div>

  <!-- Result -->
  <div class="result-box" id="resultBox">

    <!-- Main stats -->
    <div class="result-row">
      <span class="label">Best match</span>
      <span class="value" id="resScore">—</span>
    </div>
    <div class="result-row">
      <span class="label">Resume used</span>
      <span class="value" id="resResume">—</span>
    </div>
    <div class="result-row">
      <span class="label">Outreach</span>
      <span class="value" id="resOutreach">—</span>
    </div>
    <div class="result-row">
      <span class="label">Gmail draft</span>
      <span class="value" id="resDraft">—</span>
    </div>
    <div class="result-row">
      <span class="label">Application</span>
      <span class="value link" id="resAppLink">—</span>
    </div>
    <div id="contactsContainer"></div>

    <!-- Matched / missing skills -->
    <hr class="result-divider" id="skillsDivider" style="display:none" />
    <div id="skillsSection" style="display:none">
      <div id="matchedSection" style="display:none;margin-bottom:6px">
        <div class="skill-label">Matched skills</div>
        <div class="skills-row" id="matchedPills"></div>
      </div>
      <div id="missingSection" style="display:none">
        <div class="skill-label">Missing skills</div>
        <div class="skills-row" id="missingPills"></div>
      </div>
    </div>

    <!-- All resume scores -->
    <hr class="result-divider" id="scoresDivider" style="display:none" />
    <div id="scoresSection" style="display:none">
      <div class="scores-label">All resume scores</div>
      <div id="scoresBars"></div>
    </div>

  </div>

  <!-- Actions -->
  <button class="btn btn-primary" id="processBtn" disabled>Capture &amp; Process</button>
  <button class="btn btn-secondary" id="refreshBtn">Re-scan page</button>

  <div class="footer-links">
    <a class="footer-link" id="docsLink" href="#">API dashboard →</a>
    <a class="footer-link" id="appsLink" href="#">All applications →</a>
  </div>

  <div class="settings-row">
    <label for="backendUrlInput">Backend</label>
    <input type="text" id="backendUrlInput" placeholder="https://your-app.onrender.com" />
    <button class="btn-save" id="saveUrlBtn">Save</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
