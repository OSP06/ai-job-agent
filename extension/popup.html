<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Job Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─────────────────────────────────────────────
       Design system
       Page bg:      #f0f0f8  (soft lavender-white)
       Card bg:      #1c1c2c  (deep navy)
       Card deep:    #13131f  (darker panel)
       Card deepest: #0e0e18  (email / inner panel)
       Border:       #2a2a3e
       Divider:      #232333

       Text on card (dark):
         primary   #eeeef8
         secondary #a8a8c8
         muted     #6868888

       Text on page (light):
         primary   #1a1a30
         secondary #4a4a68
         muted     #9090b0

       Accent:
         blue   #4f80f0   on dark / #3060d8 on light
         green  #22c96a
         amber  #f5a623
         red    #f06060
    ───────────────────────────────────────────── */

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 390px;
      background: #f0f0f8;
      color: #1a1a30;
      padding: 14px 14px 10px;
    }

    /* ── Header ───────────────────────────────── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 9px; }
    .header-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #3060d8 0%, #6090f8 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(48,96,216,.28);
    }
    .header h1 { font-size: 14px; font-weight: 700; color: #1a1a30; letter-spacing: -0.02em; }
    .header p  { font-size: 10px; color: #8080a8; margin-top: 1px; }
    .header-tag {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      background: #e8e8f8; color: #5070c8; padding: 3px 8px; border-radius: 20px;
      border: 1px solid #d0d0ec;
    }

    /* ── Job card ─────────────────────────────── */
    .job-card {
      background: #1c1c2c;
      border: 1px solid #2a2a3e;
      border-left: 3px solid #32324a;
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 10px;
      transition: border-left-color .35s;
    }
    .job-card.score-high { border-left-color: #22c96a; }
    .job-card.score-mid  { border-left-color: #f5a623; }
    .job-card.score-low  { border-left-color: #f06060; }
    .job-card .title {
      font-size: 12.5px; font-weight: 600; color: #eeeef8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card .company {
      font-size: 11px; color: #8888a8; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card .url {
      font-size: 9.5px; color: #46465e; margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card.empty .title { color: #46465e; font-weight: 400; }

    /* ── Status badge ─────────────────────────── */
    .status-row {
      display: flex; align-items: center;
      margin-bottom: 10px; min-height: 24px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600;
      padding: 4px 11px; border-radius: 20px;
    }
    .badge.idle       { background: #e8e8f4; color: #6868988; border: 1px solid #d4d4ec; }
    .badge.scraping   { background: #dde8ff; color: #2850c8; border: 1px solid #b8caff; }
    .badge.processing { background: #fff4d6; color: #a06800; border: 1px solid #ffd88a; }
    .badge.success    { background: #d0f5e0; color: #0a6e2a; border: 1px solid #9ae8bc; }
    .badge.error      { background: #ffe0e0; color: #b81818; border: 1px solid #ffb8b8; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .dot.pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── Result box ───────────────────────────── */
    .result-box {
      background: #1c1c2c;
      border: 1px solid #2a2a3e;
      border-radius: 11px;
      overflow: hidden;
      margin-bottom: 11px;
      display: none;
    }
    .result-box.visible { display: block; }

    /* Score hero */
    .score-hero {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 15px;
      background: #13131f;
      border-bottom: 1px solid #232333;
    }
    .score-left { display: flex; align-items: baseline; gap: 5px; }
    .score-number {
      font-size: 36px; font-weight: 800; letter-spacing: -0.05em; line-height: 1;
      color: #3a3a52;
    }
    .score-label {
      font-size: 10px; color: #565672; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase;
    }
    .score-high { color: #22c96a !important; }
    .score-mid  { color: #f5a623 !important; }
    .score-low  { color: #f06060 !important; }
    .score-meta { text-align: right; }
    .score-meta .rm-label {
      font-size: 9px; color: #565672; letter-spacing: 0.06em;
      text-transform: uppercase; font-weight: 700;
    }
    .score-meta .rm-name {
      font-size: 11.5px; color: #b0b0d0; font-weight: 500; margin-top: 3px;
      max-width: 155px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Section label */
    .section-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #565672; margin-bottom: 8px;
    }

    /* Info rows */
    .info-rows { padding: 11px 15px 6px; }
    .result-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .result-row .label { color: #686888; flex-shrink: 0; font-size: 11px; font-weight: 500; }
    .result-row .value {
      color: #b0b0d0; font-weight: 600; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 220px; font-size: 11px;
    }
    .value.clickable { color: #6090f8; cursor: pointer; }
    .value.clickable:hover { color: #90b8ff; text-decoration: underline; }
    .value.link { color: #6090f8; cursor: pointer; }
    .value.link:hover { color: #90b8ff; text-decoration: underline; }
    .value.success { color: #22c96a; }
    .value.muted   { color: #46465e; }

    /* Email expand panel */
    .email-panel {
      margin: 0 15px 9px;
      background: #0e0e18;
      border: 1px solid #1e1e30;
      border-radius: 8px;
      padding: 12px 13px;
    }
    .email-subject {
      font-weight: 600; color: #d8d8f0; margin-bottom: 8px;
      font-size: 11px; line-height: 1.45;
    }
    .email-body {
      color: #8888a8; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
      max-height: 140px; overflow-y: auto;
      font-size: 10.5px;
    }
    .email-body::-webkit-scrollbar { width: 3px; }
    .email-body::-webkit-scrollbar-track { background: transparent; }
    .email-body::-webkit-scrollbar-thumb { background: #2a2a40; border-radius: 2px; }
    .copy-btn {
      margin-top: 9px; background: #1c1c2c; border: 1px solid #2a2a3e;
      color: #8080a8; font-size: 10px; padding: 4px 10px; border-radius: 5px;
      cursor: pointer; transition: all .15s;
    }
    .copy-btn:hover { color: #eeeef8; border-color: #4f80f0; background: #1e2040; }

    /* Section divider */
    .section-divider { border: none; border-top: 1px solid #232333; margin: 0; }

    /* Contact cards */
    .contacts-section { padding: 11px 15px 9px; }
    .contact-card {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      margin-bottom: 6px;
      background: #13131f;
      border: 1px solid #232333;
      transition: border-color .15s, background .15s;
    }
    .contact-card:last-child { margin-bottom: 0; }
    .contact-card.has-link { cursor: pointer; }
    .contact-card.has-link:hover { border-color: #4f80f0; background: #161626; }
    .contact-card.has-link:hover .contact-name { color: #6090f8; }
    .contact-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; flex-shrink: 0;
      background: #242438; color: #686888;
      letter-spacing: 0.02em; border: 1px solid #2e2e48;
    }
    .contact-avatar.verified { background: #0a2818; color: #22c96a; border-color: #1a4828; }
    .contact-details { flex: 1; min-width: 0; }
    .contact-name {
      font-size: 11.5px; font-weight: 600; color: #d0d0e8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color .15s;
    }
    .check { color: #22c96a; font-size: 9.5px; margin-left: 3px; }
    .contact-role {
      font-size: 10px; color: #686888; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .contact-arrow { font-size: 13px; color: #38384e; flex-shrink: 0; transition: color .15s; }
    .contact-card.has-link:hover .contact-arrow { color: #6090f8; }
    .no-contacts { font-size: 11px; color: #686888; padding: 2px 0; font-style: italic; }

    /* Skills */
    .skills-section { padding: 11px 15px 11px; }
    .skills-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .skill-group { margin-bottom: 10px; }
    .skill-group:last-child { margin-bottom: 0; }
    .pill { font-size: 10px; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
    .pill.match   { background: #0c2818; color: #22c96a; border: 1px solid #164830; }
    .pill.missing { background: #280c0c; color: #f07070; border: 1px solid #481616; }

    /* Resume score bars */
    .scores-section { padding: 11px 15px 13px; }
    .score-bar-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 7px;
    }
    .score-bar-row:last-child { margin-bottom: 0; }
    .score-bar-row .sname {
      color: #686888; font-size: 10px; width: 115px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;
    }
    .score-bar-row .sname.best { color: #d0d0e8; font-weight: 700; }
    .bar-track { flex: 1; height: 5px; background: #242438; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; background: #4060c0; transition: width .5s ease; }
    .bar-fill.best { background: linear-gradient(90deg, #1aac58, #22c96a); }
    .bar-fill.low  { background: #c04040; }
    .score-bar-row .spct { font-size: 10px; color: #686888; width: 34px; text-align: right; flex-shrink: 0; }

    /* ── Apply bar ───────────────────────────── */
    .apply-bar { padding: 0 15px 13px; }
    .btn-apply {
      width: 100%; padding: 9px;
      border: none; border-radius: 8px;
      background: #16a34a; color: #ffffff;
      font-size: 12px; font-weight: 700;
      cursor: pointer; letter-spacing: -0.01em;
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 2px 8px rgba(22,163,74,.30);
    }
    .btn-apply:hover:not(:disabled) {
      background: #15903f; transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(22,163,74,.38);
    }
    .btn-apply:active:not(:disabled) { transform: translateY(0); }
    .btn-apply:disabled { background: #1c1c2c; color: #46465e; cursor: not-allowed; box-shadow: none; }

    /* ── Action buttons ──────────────────────── */
    .btn {
      width: 100%; padding: 10px 14px; border: none; border-radius: 9px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      letter-spacing: -0.01em;
    }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #3060d8 0%, #5580f0 100%);
      color: #ffffff;
      box-shadow: 0 2px 12px rgba(48,96,216,.30);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(48,96,216,.40);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
    .btn-secondary {
      background: #ffffff; color: #2a2a48;
      border: 1.5px solid #d0d0e8; margin-top: 7px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .btn-secondary:hover:not(:disabled) {
      background: #f4f4fc; border-color: #b8b8d8; color: #1a1a30;
    }

    /* ── Footer ──────────────────────────────── */
    .footer-links { display: flex; justify-content: space-between; margin-top: 10px; }
    .footer-link {
      font-size: 10px; color: #9090b8; text-decoration: none; cursor: pointer;
      transition: color .15s;
    }
    .footer-link:hover { color: #3060d8; }

    /* ── Settings ────────────────────────────── */
    .settings-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    .settings-row label { font-size: 10px; color: #7070909; white-space: nowrap; }
    .settings-row input {
      flex: 1; background: #ffffff; border: 1.5px solid #d0d0e8;
      border-radius: 6px; color: #2a2a48; font-size: 10px;
      padding: 4px 8px; outline: none;
      transition: border-color .15s;
    }
    .settings-row input::placeholder { color: #a8a8c8; }
    .settings-row input:focus { border-color: #4f80f0; }
    .btn-save {
      background: #1c1c2c; border: 1px solid #2a2a3e;
      color: #a8a8c8; font-size: 10px; font-weight: 600;
      padding: 4px 10px; border-radius: 6px; cursor: pointer;
      white-space: nowrap; transition: all .15s;
    }
    .btn-save:hover { background: #4f80f0; border-color: #4f80f0; color: #ffffff; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-icon">🤖</div>
      <div>
        <h1>AI Job Agent</h1>
        <p>Capture · Match · Outreach</p>
      </div>
    </div>
    <span class="header-tag">AI Powered</span>
  </div>

  <!-- Job preview -->
  <div class="job-card empty" id="jobCard">
    <div class="title" id="jobTitle">Scanning page…</div>
    <div class="company" id="jobCompany"></div>
    <div class="url" id="jobUrl"></div>
  </div>

  <!-- Status -->
  <div class="status-row">
    <span class="badge idle" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">Ready</span>
    </span>
  </div>

  <!-- Result -->
  <div class="result-box" id="resultBox">

    <!-- Score hero -->
    <div class="score-hero">
      <div class="score-left">
        <span class="score-number" id="resScore">—</span>
        <span class="score-label">match</span>
      </div>
      <div class="score-meta">
        <div class="rm-label">Resume used</div>
        <div class="rm-name" id="resResume">—</div>
      </div>
    </div>

    <!-- Info rows -->
    <div class="info-rows">
      <div class="result-row">
        <span class="label">Outreach</span>
        <span class="value" id="resOutreach">—</span>
      </div>

      <div id="outreachPanel" style="display:none;margin:0 -15px 4px">
        <div class="email-panel" style="margin:0 15px 0">
          <div class="email-subject" id="emailSubject"></div>
          <div class="email-body" id="emailBody"></div>
          <button class="copy-btn" id="copyBtn">Copy email</button>
        </div>
      </div>

      <div class="result-row">
        <span class="label">Gmail draft</span>
        <span class="value" id="resDraft">—</span>
      </div>
      <div class="result-row" style="margin-bottom:4px">
        <span class="label">Application</span>
        <span class="value link" id="resAppLink">—</span>
      </div>
    </div>

    <!-- Apply bar -->
    <div class="apply-bar" id="applyBar" style="display:none">
      <button class="btn-apply" id="applyBtn">Mark as Applied</button>
    </div>

    <!-- Contacts -->
    <hr class="section-divider" id="contactDivider" style="display:none" />
    <div class="contacts-section" id="contactsSection" style="display:none">
      <div class="section-label">Contacts</div>
      <div id="contactsContainer"></div>
    </div>

    <!-- Skills -->
    <hr class="section-divider" id="skillsDivider" style="display:none" />
    <div class="skills-section" id="skillsSection" style="display:none">
      <div class="skill-group" id="matchedSection" style="display:none">
        <div class="section-label">Matched skills</div>
        <div class="skills-row" id="matchedPills"></div>
      </div>
      <div class="skill-group" id="missingSection" style="display:none">
        <div class="section-label" style="margin-top:9px">Missing skills</div>
        <div class="skills-row" id="missingPills"></div>
      </div>
    </div>

    <!-- Resume score comparison -->
    <hr class="section-divider" id="scoresDivider" style="display:none" />
    <div class="scores-section" id="scoresSection" style="display:none">
      <div class="section-label">Resume comparison</div>
      <div id="scoresBars"></div>
    </div>

  </div>

  <!-- Actions -->
  <button class="btn btn-primary" id="processBtn" disabled>Capture &amp; Process</button>
  <button class="btn btn-secondary" id="refreshBtn">Re-scan page</button>

  <div class="footer-links">
    <a class="footer-link" id="docsLink" href="#">API dashboard →</a>
    <a class="footer-link" id="appsLink" href="#">All applications →</a>
  </div>

  <div class="settings-row">
    <label for="backendUrlInput">Backend</label>
    <input type="text" id="backendUrlInput" placeholder="https://your-app.onrender.com" />
    <button class="btn-save" id="saveUrlBtn">Save</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
