<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Job Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 390px;
      background: #0b0b10;
      color: #dcdcec;
      padding: 14px 15px 12px;
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px; padding-bottom: 12px;
      border-bottom: 1px solid #1e1e2c;
      position: relative;
    }
    .header::after {
      content: ''; position: absolute; bottom: -1px; left: 0;
      width: 48px; height: 1px;
      background: linear-gradient(90deg, #5b8dee, transparent);
    }
    .header-icon { font-size: 20px; line-height: 1; }
    .header h1 { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
    .header p  { font-size: 10.5px; color: #6868888; margin-top: 1px; }

    /* ── Job card ── */
    .job-card {
      background: #13131e;
      border: 1px solid #1e1e2c;
      border-left: 3px solid #252538;
      border-radius: 9px;
      padding: 10px 12px;
      margin-bottom: 10px;
      transition: border-left-color .4s;
    }
    .job-card.score-high { border-left-color: #22c55e; }
    .job-card.score-mid  { border-left-color: #f59e0b; }
    .job-card.score-low  { border-left-color: #ef4444; }
    .job-card .title {
      font-size: 12.5px; font-weight: 600; color: #eeeef8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card .company {
      font-size: 11px; color: #7878988; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card .url {
      font-size: 9.5px; color: #44445a; margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card.empty .title { color: #3e3e58; font-weight: 400; }

    /* ── Status badge ── */
    .status-row {
      display: flex; align-items: center;
      margin-bottom: 10px; min-height: 22px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 500;
      padding: 3px 10px; border-radius: 20px;
    }
    .badge.idle       { background: #17172200; color: #60607888; border: 1px solid #22223000; }
    .badge.scraping   { background: #0d1422; color: #7aaeff; border: 1px solid #1a2a44; }
    .badge.processing { background: #1a1400; color: #f9b730; border: 1px solid #2e2200; }
    .badge.success    { background: #071a0e; color: #34d870; border: 1px solid #0e3018; }
    .badge.error      { background: #1a0808; color: #f87171; border: 1px solid #2e1212; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .dot.pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── Result box ── */
    .result-box {
      background: #13131e;
      border: 1px solid #1e1e2c;
      border-radius: 11px;
      overflow: hidden;
      margin-bottom: 10px;
      display: none;
    }
    .result-box.visible { display: block; }

    /* Score hero */
    .score-hero {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 14px;
      background: linear-gradient(135deg, #141420 0%, #111118 100%);
      border-bottom: 1px solid #1e1e2c;
    }
    .score-left { display: flex; align-items: baseline; gap: 5px; }
    .score-number {
      font-size: 34px; font-weight: 800; letter-spacing: -0.05em; line-height: 1;
      color: #44445a;
    }
    .score-label {
      font-size: 10px; color: #5a5a78; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .score-high { color: #34d870 !important; }
    .score-low  { color: #f87171 !important; }
    .score-mid  { color: #f9b730 !important; }
    .score-meta { text-align: right; }
    .score-meta .rm-label {
      font-size: 9.5px; color: #5a5a78; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600;
    }
    .score-meta .rm-name {
      font-size: 11.5px; color: #a8a8c8; font-weight: 500; margin-top: 3px;
      max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Section label */
    .section-label {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: #5a5a78; margin-bottom: 7px;
    }

    /* Info rows */
    .info-rows { padding: 10px 14px 6px; }
    .result-row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 7px;
    }
    .result-row .label { color: #6060788; flex-shrink: 0; font-size: 11px; }
    .result-row .value {
      color: #a8a8c8; font-weight: 500; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 220px; font-size: 11px;
    }
    .value.clickable { color: #7aaeff; cursor: pointer; }
    .value.clickable:hover { color: #aac8ff; text-decoration: underline; }
    .value.link { color: #7aaeff; cursor: pointer; }
    .value.link:hover { color: #aac8ff; text-decoration: underline; }
    .value.success { color: #34d870; }
    .value.muted   { color: #4a4a68; }

    /* Email expand panel */
    .email-panel {
      margin: 0 14px 8px;
      background: #0d0d16;
      border: 1px solid #1e1e30;
      border-radius: 8px;
      padding: 11px 12px;
    }
    .email-subject {
      font-weight: 600; color: #d0d0e8; margin-bottom: 8px;
      font-size: 11px; line-height: 1.45;
    }
    .email-body {
      color: #8888a8; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
      max-height: 140px; overflow-y: auto;
      font-size: 10.5px;
    }
    .email-body::-webkit-scrollbar { width: 3px; }
    .email-body::-webkit-scrollbar-track { background: transparent; }
    .email-body::-webkit-scrollbar-thumb { background: #2a2a40; border-radius: 2px; }
    .copy-btn {
      margin-top: 9px; background: #1a1a28; border: 1px solid #28283c;
      color: #7070909; font-size: 10px; padding: 4px 10px; border-radius: 5px;
      cursor: pointer; transition: color .15s, border-color .15s, background .15s;
    }
    .copy-btn:hover { color: #d0d0e8; border-color: #3c3c58; background: #1e1e30; }

    /* Section divider */
    .section-divider { border: none; border-top: 1px solid #1a1a28; margin: 0; }

    /* Contact cards */
    .contacts-section { padding: 10px 14px 8px; }
    .contact-card {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      margin-bottom: 5px; background: #0f0f1a;
      border: 1px solid #1c1c2c;
      transition: border-color .15s, background .15s;
    }
    .contact-card:last-child { margin-bottom: 0; }
    .contact-card.has-link { cursor: pointer; }
    .contact-card.has-link:hover { border-color: #2e3a58; background: #111120; }
    .contact-card.has-link:hover .contact-name { color: #7aaeff; }
    .contact-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; flex-shrink: 0;
      background: #1e1e30; color: #5a5a78;
      letter-spacing: 0.02em; border: 1px solid #2a2a40;
    }
    .contact-avatar.verified {
      background: #071a0e; color: #34d870; border-color: #0e3018;
    }
    .contact-details { flex: 1; min-width: 0; }
    .contact-name {
      font-size: 11.5px; font-weight: 500; color: #c8c8e0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color .15s;
    }
    .check { color: #34d870; font-size: 9.5px; margin-left: 3px; }
    .contact-role {
      font-size: 10px; color: #606078; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .contact-arrow { font-size: 14px; color: #2e2e48; flex-shrink: 0; transition: color .15s; }
    .contact-card.has-link:hover .contact-arrow { color: #7aaeff; }
    .no-contacts { font-size: 11px; color: #5a5a78; padding: 2px 0; font-style: italic; }

    /* Skills */
    .skills-section { padding: 10px 14px 10px; }
    .skills-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .skill-group { margin-bottom: 10px; }
    .skill-group:last-child { margin-bottom: 0; }
    .pill {
      font-size: 10px; padding: 3px 9px; border-radius: 20px; font-weight: 500;
    }
    .pill.match   { background: #071a0e; color: #34d870; border: 1px solid #0e3018; }
    .pill.missing { background: #1a0808; color: #f87171; border: 1px solid #300e0e; }

    /* Resume score bars */
    .scores-section { padding: 10px 14px 12px; }
    .score-bar-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .score-bar-row:last-child { margin-bottom: 0; }
    .score-bar-row .sname {
      color: #606078; font-size: 10px; width: 115px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;
    }
    .score-bar-row .sname.best { color: #c8c8e0; font-weight: 600; }
    .bar-track {
      flex: 1; height: 5px; background: #1c1c2c; border-radius: 4px; overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 4px; background: #3a5ee8; transition: width .5s ease; }
    .bar-fill.best { background: linear-gradient(90deg, #22c55e, #34d870); }
    .bar-fill.low  { background: #ef4444; }
    .score-bar-row .spct {
      font-size: 10px; color: #606078; width: 34px; text-align: right; flex-shrink: 0;
    }

    /* ── Apply bar ── */
    .apply-bar { padding: 0 14px 12px; }
    .btn-apply {
      width: 100%; padding: 8px; border: 1px solid #1e4a2833;
      border-radius: 8px; background: #071a0e33;
      color: #34d870; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background .15s, border-color .15s;
      letter-spacing: -0.01em;
    }
    .btn-apply:hover:not(:disabled) { background: #0a2414; border-color: #22c55e55; }
    .btn-apply:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Buttons ── */
    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 9px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      letter-spacing: -0.01em;
    }
    .btn:disabled { opacity: .3; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #3055d8 0%, #5b8dee 100%);
      color: #fff; box-shadow: 0 2px 12px rgba(91,141,238,.22);
    }
    .btn-primary:hover:not(:disabled) {
      opacity: .92; transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(91,141,238,.32);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
    .btn-secondary {
      background: #13131e; color: #606078;
      border: 1px solid #1e1e2c; margin-top: 7px;
    }
    .btn-secondary:hover:not(:disabled) { color: #a0a0c0; border-color: #2a2a3e; }

    /* ── Footer ── */
    .footer-links { display: flex; justify-content: space-between; margin-top: 10px; }
    .footer-link {
      font-size: 10px; color: #3e3e58; text-decoration: none; cursor: pointer;
      transition: color .15s;
    }
    .footer-link:hover { color: #7070909; }

    /* ── Settings ── */
    .settings-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    .settings-row label { font-size: 10px; color: #4a4a68; white-space: nowrap; }
    .settings-row input {
      flex: 1; background: #13131e; border: 1px solid #1e1e2c;
      border-radius: 6px; color: #8888a8; font-size: 10px; padding: 4px 8px; outline: none;
      transition: border-color .15s, color .15s;
    }
    .settings-row input:focus { border-color: #4070d8; color: #c8c8e0; }
    .btn-save {
      background: #13131e; border: 1px solid #1e1e2c; color: #4a4a68;
      font-size: 10px; padding: 4px 9px; border-radius: 5px; cursor: pointer;
      white-space: nowrap; transition: color .15s, border-color .15s;
    }
    .btn-save:hover { color: #c0c0e0; border-color: #2e2e48; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <span class="header-icon">🤖</span>
    <div>
      <h1>AI Job Agent</h1>
      <p>Capture · Match · Outreach</p>
    </div>
  </div>

  <!-- Job preview -->
  <div class="job-card empty" id="jobCard">
    <div class="title" id="jobTitle">Scanning page…</div>
    <div class="company" id="jobCompany"></div>
    <div class="url" id="jobUrl"></div>
  </div>

  <!-- Status -->
  <div class="status-row">
    <span class="badge idle" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">Ready</span>
    </span>
  </div>

  <!-- Result -->
  <div class="result-box" id="resultBox">

    <!-- Score hero -->
    <div class="score-hero">
      <div class="score-left">
        <span class="score-number" id="resScore">—</span>
        <span class="score-label">match</span>
      </div>
      <div class="score-meta">
        <div class="rm-label">Resume used</div>
        <div class="rm-name" id="resResume">—</div>
      </div>
    </div>

    <!-- Info rows -->
    <div class="info-rows">
      <div class="result-row">
        <span class="label">Outreach</span>
        <span class="value" id="resOutreach">—</span>
      </div>

      <!-- Email expand panel (hidden until outreach row clicked) -->
      <div id="outreachPanel" style="display:none;margin:0 -14px 4px">
        <div class="email-panel" style="margin:0 14px 0">
          <div class="email-subject" id="emailSubject"></div>
          <div class="email-body" id="emailBody"></div>
          <button class="copy-btn" id="copyBtn">Copy email</button>
        </div>
      </div>

      <div class="result-row">
        <span class="label">Gmail draft</span>
        <span class="value" id="resDraft">—</span>
      </div>
      <div class="result-row" style="margin-bottom:4px">
        <span class="label">Application</span>
        <span class="value link" id="resAppLink">—</span>
      </div>
    </div>

    <!-- Apply bar -->
    <div class="apply-bar" id="applyBar" style="display:none">
      <button class="btn-apply" id="applyBtn">Mark as Applied</button>
    </div>

    <!-- Contacts -->
    <hr class="section-divider" id="contactDivider" style="display:none" />
    <div class="contacts-section" id="contactsSection" style="display:none">
      <div class="section-label">Contacts</div>
      <div id="contactsContainer"></div>
    </div>

    <!-- Skills -->
    <hr class="section-divider" id="skillsDivider" style="display:none" />
    <div class="skills-section" id="skillsSection" style="display:none">
      <div class="skill-group" id="matchedSection" style="display:none">
        <div class="section-label">Matched skills</div>
        <div class="skills-row" id="matchedPills"></div>
      </div>
      <div class="skill-group" id="missingSection" style="display:none">
        <div class="section-label" style="margin-top:8px">Missing skills</div>
        <div class="skills-row" id="missingPills"></div>
      </div>
    </div>

    <!-- Resume score comparison -->
    <hr class="section-divider" id="scoresDivider" style="display:none" />
    <div class="scores-section" id="scoresSection" style="display:none">
      <div class="section-label">Resume comparison</div>
      <div id="scoresBars"></div>
    </div>

  </div>

  <!-- Actions -->
  <button class="btn btn-primary" id="processBtn" disabled>Capture &amp; Process</button>
  <button class="btn btn-secondary" id="refreshBtn">Re-scan page</button>

  <div class="footer-links">
    <a class="footer-link" id="docsLink" href="#">API dashboard →</a>
    <a class="footer-link" id="appsLink" href="#">All applications →</a>
  </div>

  <div class="settings-row">
    <label for="backendUrlInput">Backend</label>
    <input type="text" id="backendUrlInput" placeholder="https://your-app.onrender.com" />
    <button class="btn-save" id="saveUrlBtn">Save</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
