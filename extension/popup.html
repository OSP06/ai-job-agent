<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Job Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 375px;
      background: #0d0d12;
      color: #e0e0e8;
      padding: 16px;
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; padding-bottom: 13px;
      border-bottom: 1px solid #1a1a24;
    }
    .header-icon { font-size: 21px; }
    .header h1 { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
    .header p  { font-size: 11px; color: #44445a; margin-top: 1px; }

    /* ── Job card ── */
    .job-card {
      background: #12121a;
      border: 1px solid #1c1c28;
      border-left: 3px solid #252535;
      border-radius: 9px;
      padding: 11px 13px;
      margin-bottom: 11px;
      transition: border-left-color .4s;
    }
    .job-card.score-high { border-left-color: #22c55e; }
    .job-card.score-mid  { border-left-color: #f59e0b; }
    .job-card.score-low  { border-left-color: #ef4444; }
    .job-card .title {
      font-size: 13px; font-weight: 600; color: #f0f0f8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card .company {
      font-size: 11.5px; color: #55556a; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card .url {
      font-size: 10px; color: #2e2e42; margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-card.empty .title { color: #33334a; font-weight: 400; }

    /* ── Status badge ── */
    .status-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 11px; min-height: 22px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 500;
      padding: 3px 9px; border-radius: 12px;
    }
    .badge.idle       { background: #16161f; color: #44445a; }
    .badge.scraping   { background: #111825; color: #5b8dee; }
    .badge.processing { background: #1c1608; color: #f59e0b; }
    .badge.success    { background: #091910; color: #22c55e; }
    .badge.error      { background: #1a0808; color: #ef4444; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .dot.pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── Result box ── */
    .result-box {
      background: #12121a;
      border: 1px solid #1c1c28;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 11px;
      display: none;
    }
    .result-box.visible { display: block; }

    /* Score hero */
    .score-hero {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 14px 12px;
      border-bottom: 1px solid #1a1a24;
    }
    .score-left { display: flex; align-items: baseline; gap: 6px; }
    .score-number {
      font-size: 32px; font-weight: 800; letter-spacing: -0.04em; line-height: 1;
      color: #555;
    }
    .score-label { font-size: 10px; color: #33334a; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
    .score-high { color: #22c55e !important; }
    .score-low  { color: #ef4444 !important; }
    .score-mid  { color: #f59e0b !important; }
    .score-meta { text-align: right; }
    .score-meta .rm-label { font-size: 10px; color: #33334a; letter-spacing: 0.03em; text-transform: uppercase; }
    .score-meta .rm-name  { font-size: 12px; color: #9090a8; font-weight: 500; margin-top: 2px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Info rows */
    .info-rows { padding: 10px 14px 4px; }
    .result-row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 6px;
    }
    .result-row .label { color: #44445a; flex-shrink: 0; font-size: 11px; }
    .result-row .value {
      color: #9090a8; font-weight: 500; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 220px; font-size: 11px;
    }
    .value.clickable {
      color: #5b8dee; cursor: pointer;
    }
    .value.clickable:hover { color: #8ab4ff; text-decoration: underline; }
    .value.link { color: #5b8dee; cursor: pointer; }
    .value.link:hover { color: #8ab4ff; text-decoration: underline; }
    .value.success { color: #22c55e; }
    .value.muted   { color: #33334a; }

    /* Email expand panel */
    .email-panel {
      margin: 0 14px 8px;
      background: #0a0a10;
      border: 1px solid #1a1a24;
      border-radius: 7px;
      padding: 10px 11px;
      font-size: 11px;
    }
    .email-subject {
      font-weight: 600; color: #c0c0d4; margin-bottom: 7px;
      font-size: 11px; line-height: 1.4;
    }
    .email-body {
      color: #6a6a80; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
      max-height: 150px; overflow-y: auto;
      font-size: 10.5px;
    }
    .email-body::-webkit-scrollbar { width: 3px; }
    .email-body::-webkit-scrollbar-track { background: transparent; }
    .email-body::-webkit-scrollbar-thumb { background: #252535; border-radius: 2px; }
    .copy-btn {
      margin-top: 8px; background: #16161f; border: 1px solid #252535;
      color: #55556a; font-size: 10px; padding: 3px 9px; border-radius: 5px;
      cursor: pointer; transition: color .15s, border-color .15s;
    }
    .copy-btn:hover { color: #c0c0d4; border-color: #3a3a50; }

    /* Section divider */
    .section-divider {
      border: none; border-top: 1px solid #1a1a24; margin: 0;
    }

    /* Contact cards */
    .contacts-section { padding: 10px 14px 6px; }
    .contact-card {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 9px; border-radius: 7px;
      margin-bottom: 5px; background: #0d0d14;
      border: 1px solid #181826;
      transition: border-color .15s;
    }
    .contact-card:last-child { margin-bottom: 0; }
    .contact-card.has-link { cursor: pointer; }
    .contact-card.has-link:hover { border-color: #2a2a40; }
    .contact-card.has-link:hover .contact-name { color: #5b8dee; }
    .contact-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9.5px; font-weight: 700; flex-shrink: 0;
      background: #1a1a28; color: #44445a;
      letter-spacing: 0.03em;
    }
    .contact-avatar.verified { background: #091c10; color: #22c55e; }
    .contact-details { flex: 1; min-width: 0; }
    .contact-name {
      font-size: 11.5px; font-weight: 500; color: #c0c0d4;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color .15s;
    }
    .check { color: #22c55e; font-size: 10px; margin-left: 2px; }
    .contact-role {
      font-size: 10px; color: #44445a; margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .contact-arrow { font-size: 13px; color: #252535; flex-shrink: 0; transition: color .15s; }
    .contact-card.has-link:hover .contact-arrow { color: #5b8dee; }
    .no-contacts { font-size: 11px; color: #33334a; padding: 2px 0; }

    /* Skills */
    .skills-section { padding: 10px 14px 8px; }
    .skills-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 2px; }
    .skill-label {
      font-size: 10px; color: #33334a; margin-bottom: 5px;
      letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600;
    }
    .skill-group { margin-bottom: 8px; }
    .skill-group:last-child { margin-bottom: 0; }
    .pill {
      font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: 500;
    }
    .pill.match   { background: #091c10; color: #22c55e; border: 1px solid #122a18; }
    .pill.missing { background: #1a0909; color: #ef4444; border: 1px solid #2a1212; }

    /* Resume score bars */
    .scores-section { padding: 10px 14px 12px; }
    .scores-label {
      font-size: 10px; color: #33334a; margin-bottom: 7px;
      letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600;
    }
    .score-bar-row {
      display: flex; align-items: center; gap: 7px; margin-bottom: 5px;
    }
    .score-bar-row:last-child { margin-bottom: 0; }
    .score-bar-row .sname {
      color: #44445a; font-size: 10px; width: 110px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;
    }
    .score-bar-row .sname.best { color: #c0c0d4; font-weight: 600; }
    .bar-track {
      flex: 1; height: 4px; background: #1c1c28; border-radius: 3px; overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 3px; background: #3a5ee8; transition: width .45s ease; }
    .bar-fill.best { background: #22c55e; }
    .bar-fill.low  { background: #ef4444; }
    .score-bar-row .spct { font-size: 10px; color: #44445a; width: 34px; text-align: right; flex-shrink: 0; }

    /* ── Apply bar ── */
    .apply-bar {
      padding: 0 14px 12px;
    }
    .btn-apply {
      width: 100%; padding: 8px; border: 1px solid #22c55e22;
      border-radius: 7px; background: #091c1022;
      color: #22c55e; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background .15s, border-color .15s;
      letter-spacing: -0.01em;
    }
    .btn-apply:hover:not(:disabled) { background: #091c1044; border-color: #22c55e55; }
    .btn-apply:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Buttons ── */
    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      letter-spacing: -0.01em;
    }
    .btn:disabled { opacity: .3; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #3a66e8 0%, #5b8dee 100%);
      color: #fff; box-shadow: 0 2px 10px rgba(91,141,238,.18);
    }
    .btn-primary:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); box-shadow: 0 5px 16px rgba(91,141,238,.28); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
    .btn-secondary {
      background: #12121a; color: #55556a;
      border: 1px solid #1c1c28; margin-top: 7px;
    }
    .btn-secondary:hover:not(:disabled) { color: #9090a8; border-color: #2a2a3e; }

    /* ── Footer ── */
    .footer-links {
      display: flex; justify-content: space-between; margin-top: 10px;
    }
    .footer-link {
      font-size: 10px; color: #2a2a3a; text-decoration: none; cursor: pointer;
      transition: color .15s;
    }
    .footer-link:hover { color: #55556a; }

    /* ── Settings ── */
    .settings-row {
      display: flex; align-items: center; gap: 6px; margin-top: 10px;
    }
    .settings-row label { font-size: 10px; color: #33334a; white-space: nowrap; }
    .settings-row input {
      flex: 1; background: #12121a; border: 1px solid #1c1c28;
      border-radius: 6px; color: #6a6a80; font-size: 10px; padding: 4px 8px; outline: none;
      transition: border-color .15s, color .15s;
    }
    .settings-row input:focus { border-color: #3a66e8; color: #c0c0d4; }
    .btn-save {
      background: #12121a; border: 1px solid #1c1c28; color: #44445a;
      font-size: 10px; padding: 4px 9px; border-radius: 5px; cursor: pointer;
      white-space: nowrap; transition: color .15s;
    }
    .btn-save:hover { color: #c0c0d4; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <span class="header-icon">🤖</span>
    <div>
      <h1>AI Job Agent</h1>
      <p>Capture · Match · Outreach</p>
    </div>
  </div>

  <!-- Job preview -->
  <div class="job-card empty" id="jobCard">
    <div class="title" id="jobTitle">Scanning page…</div>
    <div class="company" id="jobCompany"></div>
    <div class="url" id="jobUrl"></div>
  </div>

  <!-- Status -->
  <div class="status-row">
    <span class="badge idle" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">Ready</span>
    </span>
  </div>

  <!-- Result -->
  <div class="result-box" id="resultBox">

    <!-- Score hero -->
    <div class="score-hero">
      <div class="score-left">
        <span class="score-number" id="resScore">—</span>
        <span class="score-label">match</span>
      </div>
      <div class="score-meta">
        <div class="rm-label">Resume used</div>
        <div class="rm-name" id="resResume">—</div>
      </div>
    </div>

    <!-- Info rows -->
    <div class="info-rows">
      <div class="result-row">
        <span class="label">Outreach</span>
        <span class="value" id="resOutreach">—</span>
      </div>

      <!-- Email expand panel (hidden until outreach row clicked) -->
      <div id="outreachPanel" style="display:none;margin:0 -14px 4px">
        <div class="email-panel" style="margin:0 14px 0">
          <div class="email-subject" id="emailSubject"></div>
          <div class="email-body" id="emailBody"></div>
          <button class="copy-btn" id="copyBtn">Copy email</button>
        </div>
      </div>

      <div class="result-row">
        <span class="label">Gmail draft</span>
        <span class="value" id="resDraft">—</span>
      </div>
      <div class="result-row" style="margin-bottom:4px">
        <span class="label">Application</span>
        <span class="value link" id="resAppLink">—</span>
      </div>
    </div>

    <!-- Apply bar -->
    <div class="apply-bar" id="applyBar" style="display:none">
      <button class="btn-apply" id="applyBtn">Mark as Applied</button>
    </div>

    <!-- Contacts -->
    <hr class="section-divider" id="contactDivider" style="display:none" />
    <div class="contacts-section" id="contactsSection" style="display:none">
      <div id="contactsContainer"></div>
    </div>

    <!-- Skills -->
    <hr class="section-divider" id="skillsDivider" style="display:none" />
    <div class="skills-section" id="skillsSection" style="display:none">
      <div class="skill-group" id="matchedSection" style="display:none">
        <div class="skill-label">Matched skills</div>
        <div class="skills-row" id="matchedPills"></div>
      </div>
      <div class="skill-group" id="missingSection" style="display:none">
        <div class="skill-label">Missing skills</div>
        <div class="skills-row" id="missingPills"></div>
      </div>
    </div>

    <!-- Resume score comparison -->
    <hr class="section-divider" id="scoresDivider" style="display:none" />
    <div class="scores-section" id="scoresSection" style="display:none">
      <div class="scores-label">Resume comparison</div>
      <div id="scoresBars"></div>
    </div>

  </div>

  <!-- Actions -->
  <button class="btn btn-primary" id="processBtn" disabled>Capture &amp; Process</button>
  <button class="btn btn-secondary" id="refreshBtn">Re-scan page</button>

  <div class="footer-links">
    <a class="footer-link" id="docsLink" href="#">API dashboard →</a>
    <a class="footer-link" id="appsLink" href="#">All applications →</a>
  </div>

  <div class="settings-row">
    <label for="backendUrlInput">Backend</label>
    <input type="text" id="backendUrlInput" placeholder="https://your-app.onrender.com" />
    <button class="btn-save" id="saveUrlBtn">Save</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
