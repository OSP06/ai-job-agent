# fly.toml — Fly.io deployment config for AI Job Agent
# Deploy with: flyctl deploy

app = "ai-job-agent"   # change this to your chosen app name if taken
primary_region = "ord" # Chicago — change to nearest: lax, iad, lhr, sin, syd

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  DB_PATH          = "/data/jobs.db"
  RESUMES_DIR      = "/data/resumes"
  LOG_LEVEL        = "INFO"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = false  # keep running — no cold starts
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source      = "ai_job_agent_data"
  destination = "/data"
